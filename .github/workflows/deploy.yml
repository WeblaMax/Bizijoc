name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      # Site-ul compilat se pune și în rădăcina branch-ului main, ca să meargă și cu Pages pe „Deploy from a branch”.
      - name: Publică site-ul compilat în rădăcina branch-ului
        run: |
          rm -rf assets img index.html 404.html products.json favicon.svg
          cp -r dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html assets img products.json favicon.svg .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Site compilat (automat)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
